<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sprint Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F151B;
    --panel:#1A2229;
    --panel-2:#212B33;
    --border:#2A3640;
    --text:#EDF1F4;
    --muted:#8A9BA8;
    --track:#FF6A3D;
    --split:#2FD9A8;
    --danger:#FF5A5A;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent; height:100%;
    overflow:hidden;
  }
  .app{
    display:flex; flex-direction:column; height:100dvh; height:100vh;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .topbar h1{ font-size:1.05rem; margin:0; font-weight:700; letter-spacing:-0.01em; }
  .gates-inline{ display:flex; gap:4px; margin-top:2px; }
  .gates-inline span{
    font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--muted);
    border:1px solid var(--border); border-radius:5px; padding:1px 5px;
  }
  button{
    font-family:inherit; font-weight:600; border:none; border-radius:9px;
    cursor:pointer;
  }
  button.primary{ background:var(--track); color:#1A0F09; }
  button.secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  button.success{ background:var(--split); color:#08251C; }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button:active:not(:disabled){ transform:scale(0.98); }
  #btn-camera{ padding:9px 14px; font-size:0.85rem; flex:0 0 auto; }

  /* ---------- Collapsible kalibratiebalk ---------- */
  .calib-bar{ flex:0 0 auto; border-bottom:1px solid var(--border); background:var(--panel); }
  .calib-toggle{
    width:100%; background:transparent; border:none; color:var(--text);
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 12px; font-size:0.82rem;
  }
  .calib-toggle .chev{ color:var(--muted); transition:transform 0.15s; font-size:0.7rem; }
  .calib-bar.collapsed .calib-body{ display:none; }
  .calib-bar.collapsed .chev{ transform:rotate(-90deg); }
  .calib-bar.done .calib-toggle .dot{ background:var(--split); }
  .calib-toggle .dot{
    width:8px; height:8px; border-radius:50%; background:var(--track); display:inline-block; margin-right:7px;
  }
  .calib-body{ padding:0 12px 10px; }
  .status{
    font-size:0.78rem; padding:7px 10px; border-radius:9px; margin-bottom:8px;
    background:var(--panel-2); color:var(--muted); border:1px solid var(--border);
  }
  .status.error{ color:var(--danger); border-color:var(--danger); }
  .status.ok{ color:var(--split); border-color:var(--split); }
  .calib-body button.secondary{ padding:7px 12px; font-size:0.8rem; margin-bottom:8px; }
  .sliders{ display:flex; gap:14px; flex-wrap:wrap; }
  .sliders > div{ flex:1; min-width:140px; }
  .sliders .slabel{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--muted); }
  input[type=range]{ width:100%; accent-color:var(--track); }

  /* ---------- Sessie: camera boven, 2 kolommen onder ---------- */
  .session{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .cam-pane{
    flex:1 1 50%; min-height:0; background:#000; position:relative; overflow:hidden;
  }
  canvas#stage{ width:100%; height:100%; display:block; }
  .cam-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:0.85rem; text-align:center; padding:20px;
  }

  .lower-pane{ flex:1 1 50%; min-height:0; display:flex; border-top:1px solid var(--border); }
  .pane-left, .pane-right{
    flex:1; min-width:0; padding:10px 12px; overflow-y:auto;
  }
  .pane-left{ border-right:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .pane-right{ display:flex; flex-direction:column; }

  label{ display:block; font-size:0.72rem; color:var(--muted); margin-bottom:3px; }
  input[type=text], input[type=date]{
    width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:7px 9px; border-radius:8px; font-size:0.88rem;
    font-family:inherit;
  }
  input[type=text]:focus, input[type=date]:focus{ outline:2px solid var(--track); outline-offset:1px; }
  .row2{ display:flex; gap:8px; }
  .row2 > div{ flex:1; }

  .timer{
    font-family:'JetBrains Mono',monospace; font-weight:700;
    text-align:center; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
    font-size:2.1rem; line-height:1.1; margin:2px 0;
  }
  .timer.idle{ color:var(--muted); }
  .timer.running{ color:var(--track); }
  .timer.done{ color:var(--split); }

  #btn-start{ padding:11px; font-size:0.92rem; width:100%; }
  .btnrow{ display:flex; gap:8px; }
  .btnrow > button{ flex:1; padding:9px; font-size:0.82rem; }

  .pane-right h2{ font-size:0.8rem; color:var(--muted); font-weight:600; margin:0 0 6px; }
  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); font-size:0.85rem; }
  th{ color:var(--muted); font-weight:500; font-size:0.72rem; }
  td.time{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  td.time.pending{ color:var(--muted); font-weight:400; }
  td.time.measured{ color:var(--split); }

  /* Compacter op erg lage viewports (korte landscape-hoogte) */
  @media (max-height: 420px){
    .timer{ font-size:1.6rem; }
    #btn-start{ padding:8px; }
    .pane-left, .pane-right{ padding:6px 10px; gap:5px; }
  }

  /* Eenvoudige fallback als het toestel toch rechtop staat */
  @media (orientation: portrait){
    .lower-pane{ flex-direction:column; overflow-y:auto; }
    .pane-left{ border-right:none; border-bottom:1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>Sprint Timer</h1>
      <div class="gates-inline"><span>5m</span><span>10m</span><span>20m</span><span>30m</span></div>
    </div>
    <button class="primary" id="btn-camera">Camera starten</button>
  </div>

  <div class="calib-bar" id="calib-bar" style="display:none;">
    <button class="calib-toggle" id="calib-toggle">
      <span><span class="dot" id="calib-dot"></span><span id="calib-toggle-label">Meetpunten markeren</span></span>
      <span class="chev">▾</span>
    </button>
    <div class="calib-body" id="calib-body">
      <div class="status" id="calib-status">Tik in de camerabeelden hieronder, na elkaar, op de plek van het 5m-, 10m-, 20m- en 30m-punt.</div>
      <button class="secondary" id="btn-recalibrate">Opnieuw markeren</button>
      <div class="sliders">
        <div>
          <div class="slabel"><span>Zonebreedte</span><span id="width-val"></span></div>
          <input type="range" id="zone-width" min="3" max="20" value="7">
        </div>
        <div>
          <div class="slabel"><span>Gevoeligheid</span><span id="sens-val"></span></div>
          <input type="range" id="sensitivity" min="1" max="100" value="55">
        </div>
      </div>
    </div>
  </div>

  <div class="session">
    <div class="cam-pane" id="cam-pane">
      <canvas id="stage" style="display:none;"></canvas>
      <div class="cam-placeholder" id="cam-placeholder">Druk op "Camera starten" om te beginnen.<br>Houd het toestel horizontaal (landscape).</div>
    </div>

    <div class="lower-pane">
      <div class="pane-left">
        <div class="row2">
          <div>
            <label for="player">Spelernaam</label>
            <input type="text" id="player" list="players" placeholder="Naam">
            <datalist id="players"></datalist>
          </div>
          <div>
            <label for="date">Datum</label>
            <input type="date" id="date">
          </div>
        </div>
        <div class="timer idle" id="timer-display">0.00</div>
        <button class="primary" id="btn-start" disabled>Start (met signaal)</button>
        <div class="status" id="run-status" style="display:none;"></div>
        <div class="btnrow">
          <button class="secondary" id="btn-reset">Nieuwe poging</button>
          <button class="success" id="btn-send" disabled>Versturen</button>
        </div>
        <div class="status" id="send-status" style="display:none;"></div>
      </div>
      <div class="pane-right">
        <h2>Resultaten</h2>
        <table>
          <thead><tr><th>Punt</th><th style="text-align:right;">Tijd</th></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // Vul dit in na het deployen van de Apps Script webapp (zie README.md).
  var API_URL = 'https://script.google.com/macros/s/AKfycbyXbFEAeA7RkHjQZaStndV9MZUvZBHtFuQX6C4PKGwS4GuHtMeKgC-969fIIpsKgQndKA/exec';
  var API_TOKEN = 'FC_Kleit_7589';

  var GATES = [
    { label: '5m',  key: 't5'  },
    { label: '10m', key: 't10' },
    { label: '20m', key: 't20' },
    { label: '30m', key: 't30' }
  ];
  var START_ARM_DELAY_MS = 250;
  var CONSECUTIVE_FRAMES_NEEDED = 2;
  var RUN_TIMEOUT_MS = 20000;
  var ANALYSIS_W = 160, ANALYSIS_H = 90;
  var PIXEL_DIFF_THRESHOLD = 25;
  var prevFrameData = null;

  // Startsequentie: 2 korte waarschuwingspiepjes, dan 1 lange startpiep.
  var BEEP_SHORT_MS = 150;
  var BEEP_PAUSE_MS = 1000; // stilte na elk van de 2 korte piepjes
  var BEEP_LONG_MS = 450;

  var video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.muted = true;

  var stage = document.getElementById('stage');
  var stageCtx = stage.getContext('2d');
  var analysisCanvas = document.createElement('canvas');
  analysisCanvas.width = ANALYSIS_W;
  analysisCanvas.height = ANALYSIS_H;
  var analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });

  var els = {
    player: document.getElementById('player'),
    players: document.getElementById('players'),
    date: document.getElementById('date'),
    btnCamera: document.getElementById('btn-camera'),
    camPlaceholder: document.getElementById('cam-placeholder'),
    calibBar: document.getElementById('calib-bar'),
    calibToggle: document.getElementById('calib-toggle'),
    calibDot: document.getElementById('calib-dot'),
    calibToggleLabel: document.getElementById('calib-toggle-label'),
    calibStatus: document.getElementById('calib-status'),
    btnRecalibrate: document.getElementById('btn-recalibrate'),
    zoneWidth: document.getElementById('zone-width'),
    widthVal: document.getElementById('width-val'),
    sensitivity: document.getElementById('sensitivity'),
    sensVal: document.getElementById('sens-val'),
    timerDisplay: document.getElementById('timer-display'),
    btnStart: document.getElementById('btn-start'),
    runStatus: document.getElementById('run-status'),
    resultsBody: document.getElementById('results-body'),
    btnReset: document.getElementById('btn-reset'),
    btnSend: document.getElementById('btn-send'),
    sendStatus: document.getElementById('send-status')
  };

  var state = {
    cameraOn: false,
    calibrating: false,
    calibration: [],
    zoneWidthRatio: 0.07,
    sensitivity: 55,
    running: false,
    startTime: 0,
    armedIndex: 0,
    consecutiveHits: 0,
    results: { t5:null, t10:null, t20:null, t30:null },
    timeoutHandle: null
  };

  els.date.value = new Date().toISOString().slice(0,10);
  buildResultsTable();
  loadPlayers();

  // ---------- Camera ----------
  els.btnCamera.addEventListener('click', startCamera);

  function startCamera(){
    els.btnCamera.disabled = true;
    els.btnCamera.textContent = 'Bezig…';
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(function(stream){
      video.srcObject = stream;
      return video.play();
    }).then(function(){
      state.cameraOn = true;
      els.camPlaceholder.style.display = 'none';
      stage.style.display = 'block';
      els.btnCamera.textContent = 'Camera actief';
      sizeStage();
      requestAnimationFrame(drawLoop);
      els.calibBar.style.display = 'block';
      enterCalibrationMode();
    }).catch(function(err){
      els.btnCamera.disabled = false;
      els.btnCamera.textContent = 'Camera starten';
      alert('Camera kon niet gestart worden: ' + err.message + '\nControleer camerarechten in de browser.');
    });
  }

  function sizeStage(){
    var w = video.videoWidth || 1280, h = video.videoHeight || 720;
    stage.width = w; stage.height = h;
  }

  // ---------- Kalibratie (collapsible) ----------
  stage.addEventListener('click', function(evt){
    if (state.calibrating) handleCalibrationTap(evt);
  });

  els.calibToggle.addEventListener('click', function(){
    els.calibBar.classList.toggle('collapsed');
  });

  els.btnRecalibrate.addEventListener('click', function(){
    els.calibBar.classList.remove('collapsed');
    enterCalibrationMode();
  });

  function enterCalibrationMode(){
    state.calibrating = true;
    state.calibration = [];
    els.calibBar.classList.remove('done');
    updateCalibStatus();
    updateStartAvailability();
  }

  function handleCalibrationTap(evt){
    var rect = stage.getBoundingClientRect();
    var clickX = (evt.clientX - rect.left) / rect.width;
    if (state.calibration.length >= GATES.length) return;
    state.calibration.push({ xRatio: clamp01(clickX) });
    updateCalibStatus();
    if (state.calibration.length === GATES.length){
      state.calibrating = false;
      els.calibBar.classList.add('done');
      els.calibToggleLabel.textContent = 'Gekalibreerd — tik om te wijzigen';
      els.calibBar.classList.add('collapsed');
      updateStartAvailability();
    }
  }

  function updateCalibStatus(){
    var n = state.calibration.length;
    if (n < GATES.length){
      els.calibToggleLabel.textContent = 'Meetpunten markeren (' + n + '/' + GATES.length + ')';
      els.calibStatus.textContent = 'Tik op het ' + GATES[n].label + '-punt (' + (n+1) + ' van ' + GATES.length + ').';
      els.calibStatus.className = 'status';
    } else {
      els.calibStatus.textContent = 'Alle 4 punten gemarkeerd.';
      els.calibStatus.className = 'status ok';
    }
  }

  els.zoneWidth.addEventListener('input', function(){
    state.zoneWidthRatio = Number(els.zoneWidth.value) / 100;
    els.widthVal.textContent = els.zoneWidth.value + '%';
  });
  els.sensitivity.addEventListener('input', function(){
    state.sensitivity = Number(els.sensitivity.value);
    els.sensVal.textContent = state.sensitivity;
  });
  els.zoneWidth.dispatchEvent(new Event('input'));
  els.sensitivity.dispatchEvent(new Event('input'));

  function drawLoop(){
    if (state.cameraOn && video.readyState >= 2){
      stageCtx.drawImage(video, 0, 0, stage.width, stage.height);
      drawOverlays();
    }
    requestAnimationFrame(drawLoop);
  }

  function drawOverlays(){
    var w = stage.width, h = stage.height;
    state.calibration.forEach(function(pt, i){
      var color = i < state.armedIndex ? '#2FD9A8' : (i === state.armedIndex && state.running ? '#FF6A3D' : 'rgba(255,255,255,0.35)');
      drawZone(pt.xRatio, w, h, color, GATES[i].label);
    });
  }

  function drawZone(xRatio, w, h, color, label){
    var zw = w * state.zoneWidthRatio;
    var x = xRatio * w - zw/2;
    stageCtx.strokeStyle = color;
    stageCtx.lineWidth = Math.max(2, w * 0.004);
    stageCtx.strokeRect(x, h*0.04, zw, h*0.92);
    stageCtx.fillStyle = color;
    stageCtx.font = Math.round(h*0.06) + 'px Inter, sans-serif';
    stageCtx.fillText(label, x, h*0.035 + h*0.06);
  }

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  // ---------- Start: waarschuwingspiepjes -> lange piep -> meting ----------
  els.btnStart.addEventListener('click', startRun);

  function updateStartAvailability(){
    els.btnStart.disabled = !(state.cameraOn && state.calibration.length === GATES.length) || state.running;
  }

  function startRun(){
    if (!els.player.value.trim()){
      alert('Vul eerst een spelernaam in.');
      return;
    }
    els.btnStart.disabled = true;
    els.runStatus.style.display = 'block';
    els.runStatus.className = 'status';
    els.runStatus.textContent = 'Klaarmaken… let op de piepjes.';
    els.timerDisplay.textContent = '0.00';
    els.timerDisplay.className = 'timer idle';
    els.btnSend.disabled = true;
    buildResultsTable();

    playStartSequence();
    var totalDelay = (BEEP_SHORT_MS + BEEP_PAUSE_MS) * 2;
    setTimeout(beginMeasurement, totalDelay);
  }

  function playStartSequence(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ctx.currentTime;
      scheduleBeep(ctx, t0, 700, BEEP_SHORT_MS/1000, 0.3);
      var t1 = t0 + (BEEP_SHORT_MS + BEEP_PAUSE_MS)/1000;
      scheduleBeep(ctx, t1, 700, BEEP_SHORT_MS/1000, 0.3);
      var t2 = t1 + (BEEP_SHORT_MS + BEEP_PAUSE_MS)/1000;
      scheduleBeep(ctx, t2, 1000, BEEP_LONG_MS/1000, 0.45);
    } catch(e){ /* audio niet beschikbaar; meting start alsnog op tijd */ }
  }

  function scheduleBeep(ctx, startTime, freq, durationSec, vol){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + durationSec);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startTime); osc.stop(startTime + durationSec + 0.02);
  }

  function beginMeasurement(){
    state.results = { t5:null, t10:null, t20:null, t30:null };
    state.armedIndex = 0;
    state.consecutiveHits = 0;
    prevFrameData = null;
    state.running = true;
    state.startTime = performance.now();
    els.runStatus.textContent = 'Meting loopt — wacht op 5m-punt…';
    els.timerDisplay.className = 'timer running';

    clearTimeout(state.timeoutHandle);
    state.timeoutHandle = setTimeout(function(){
      if (state.running) finishRun(true);
    }, RUN_TIMEOUT_MS);

    requestAnimationFrame(tickTimer);
    requestAnimationFrame(analysisLoop);
  }

  function tickTimer(){
    if (!state.running) return;
    var elapsed = (performance.now() - state.startTime) / 1000;
    els.timerDisplay.textContent = elapsed.toFixed(2);
    requestAnimationFrame(tickTimer);
  }

  function analysisLoop(){
    if (!state.running) return;
    var elapsedMs = performance.now() - state.startTime;

    if (video.readyState >= 2){
      analysisCtx.drawImage(video, 0, 0, ANALYSIS_W, ANALYSIS_H);
      var frame = analysisCtx.getImageData(0, 0, ANALYSIS_W, ANALYSIS_H).data;

      if (elapsedMs >= START_ARM_DELAY_MS && state.armedIndex < GATES.length){
        var fractionThreshold = 0.30 - (state.sensitivity/100) * 0.27;
        var fraction = prevFrameData ? zoneMotionFraction(frame, prevFrameData, state.calibration[state.armedIndex].xRatio) : null;

        if (fraction !== null){
          if (fraction > fractionThreshold){
            state.consecutiveHits++;
            if (state.consecutiveHits >= CONSECUTIVE_FRAMES_NEEDED){
              registerGateHit(state.armedIndex, elapsedMs);
            }
          } else {
            state.consecutiveHits = 0;
          }
        }
      }
      prevFrameData = frame;
    }

    if (state.running) requestAnimationFrame(analysisLoop);
  }

  function zoneMotionFraction(currFrame, prevFrame, xRatio){
    var zw = Math.max(2, Math.round(ANALYSIS_W * state.zoneWidthRatio));
    var cx = Math.round(xRatio * ANALYSIS_W);
    var x0 = Math.max(0, cx - Math.round(zw/2));
    var x1 = Math.min(ANALYSIS_W, x0 + zw);
    var y0 = Math.round(ANALYSIS_H * 0.04), y1 = Math.round(ANALYSIS_H * 0.96);
    var changed = 0, total = 0;
    for (var y = y0; y < y1; y++){
      for (var x = x0; x < x1; x++){
        var idx = (y * ANALYSIS_W + x) * 4;
        var currLuma = 0.299*currFrame[idx] + 0.587*currFrame[idx+1] + 0.114*currFrame[idx+2];
        var prevLuma = 0.299*prevFrame[idx] + 0.587*prevFrame[idx+1] + 0.114*prevFrame[idx+2];
        if (Math.abs(currLuma - prevLuma) > PIXEL_DIFF_THRESHOLD) changed++;
        total++;
      }
    }
    return total ? changed / total : 0;
  }

  function registerGateHit(index, elapsedMs){
    var key = GATES[index].key;
    state.results[key] = elapsedMs / 1000;
    updateResultsRow(index, state.results[key]);
    state.consecutiveHits = 0;
    state.armedIndex++;

    if (state.armedIndex < GATES.length){
      els.runStatus.textContent = GATES[index].label + ' gemeten: ' + state.results[key].toFixed(2) + 's — wacht op ' + GATES[state.armedIndex].label + '-punt…';
    } else {
      finishRun(false);
    }
  }

  function finishRun(timedOut){
    state.running = false;
    clearTimeout(state.timeoutHandle);
    els.timerDisplay.className = 'timer done';
    els.btnStart.disabled = false;

    if (timedOut){
      els.runStatus.className = 'status error';
      els.runStatus.textContent = 'Geen volledige meting binnen ' + (RUN_TIMEOUT_MS/1000) + 's. Controleer de markeringen/gevoeligheid en probeer opnieuw.';
    } else {
      els.runStatus.className = 'status ok';
      els.runStatus.textContent = 'Meting voltooid.';
    }
    els.btnSend.disabled = !state.results.t30;
  }

  // ---------- Resultatentabel ----------
  function buildResultsTable(){
    els.resultsBody.innerHTML = '';
    GATES.forEach(function(g){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + g.label + '</td><td class="time pending" id="cell-' + g.key + '">—</td>';
      els.resultsBody.appendChild(tr);
    });
  }

  function updateResultsRow(index, seconds){
    var cell = document.getElementById('cell-' + GATES[index].key);
    if (cell){
      cell.textContent = seconds.toFixed(3) + 's';
      cell.className = 'time measured';
    }
  }

  // ---------- Versturen naar spreadsheet ----------
  els.btnSend.addEventListener('click', function(){
    els.btnSend.disabled = true;
    els.sendStatus.style.display = 'block';
    els.sendStatus.className = 'status';
    els.sendStatus.textContent = 'Bezig met versturen…';

    var payload = {
      token: API_TOKEN,
      player: els.player.value.trim(),
      date: els.date.value,
      t5: state.results.t5, t10: state.results.t10,
      t20: state.results.t20, t30: state.results.t30
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.success){
          els.sendStatus.className = 'status ok';
          els.sendStatus.textContent = 'Verstuurd naar de spreadsheet.';
          loadPlayers();
        } else {
          throw new Error((data && data.error) || 'Onbekende fout');
        }
      })
      .catch(function(err){
        els.sendStatus.className = 'status error';
        els.sendStatus.textContent = 'Versturen mislukt: ' + err.message;
        els.btnSend.disabled = false;
      });
  });

  els.btnReset.addEventListener('click', function(){
    buildResultsTable();
    els.btnSend.disabled = true;
    els.sendStatus.style.display = 'none';
    els.timerDisplay.textContent = '0.00';
    els.timerDisplay.className = 'timer idle';
    els.runStatus.style.display = 'none';
    updateStartAvailability();
  });

  function loadPlayers(){
    if (!API_URL || API_URL.indexOf('VERVANG_DIT') !== -1) return;
    fetch(API_URL + '?action=players')
      .then(function(res){ return res.json(); })
      .then(function(data){
        els.players.innerHTML = '';
        (data.players || []).forEach(function(name){
          var opt = document.createElement('option');
          opt.value = name;
          els.players.appendChild(opt);
        });
      })
      .catch(function(){ /* stil falen: autocomplete is een extraatje */ });
  }

})();
</script>
</body>
</html>
